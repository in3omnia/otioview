; Original otioview colors. Values are red, green, blue, alpha (0-255).
[colors]
window.background = 27, 27, 27, 255
details.background = 33, 33, 33, 255
scrollbar.handle.horizontal = 255, 83, 112, 255

timecode.text = 220, 220, 220, 255

frame_number.text = 25, 255, 10, 255
frame_number.background = 5, 55, 0, 120
ruler.fill = 50, 255, 20, 255
ruler.selected = 0, 255, 0, 255

item.background = 180, 180, 180, 255
item.selected = 0, 255, 0, 255
item.name = 0, 0, 0, 255
track.name = 0, 0, 0, 255
track.background = 43, 52, 59, 255
clip.video = 168, 197, 255, 255
clip.audio = 168, 197, 255, 255
clip.disabled = 100, 100, 100, 255

marker.red = 255, 0, 0, 255
marker.pink = 255, 112, 112, 255
marker.orange = 255, 160, 0, 255
marker.yellow = 255, 255, 0, 255
marker.green = 0, 255, 0, 255
marker.cyan = 0, 255, 255, 255
marker.blue = 0, 0, 255, 255
marker.purple = 160, 0, 208, 255
marker.magenta = 255, 0, 255, 255
marker.white = 255, 255, 255, 255
marker.black = 0, 0, 0, 255
marker.selected = 0, 255, 0, 255

; Layout dimensions use logical pixels; timecode.font_size uses points.
; Numbered names use video/audio indices; otherwise the OTIO track names are retained.
; A zero ruler.stem_half_width retains the original thin playhead outline.
[layout]
time_slider.height = 20
track.height = 45
track_name.width = 100
timecode.font_size = 10
track_name.numbered = false
track_name.top_left = false
clip.border_width = 0
ruler.size = 10
ruler.head_top = -5
ruler.head_bottom = 5
ruler.stem_top = 10
ruler.stem_half_width = 0
ruler.antialias = false

; Qt names: ControlModifier = Command on macOS, AltModifier = Option.
; Key pairs list backward/up first, forward/down second.
; selection.control requires (true) or excludes (false) ControlModifier.
; Frame/second/marker modifiers match exactly; cut.exact controls cut matching.
; Wheel scroll takes priority over height; both require all listed modifiers and allow extras.
; wheel.zoom = Any enables fallback zoom; wheel.scroll = Disabled removes the explicit scroll override.
[input]
selection.control = false
frame.keys = Left, Right
frame.modifier = AltModifier
second.modifier = ShiftModifier
cut.keys = Left, Right
cut.modifier = ControlModifier
cut.exact = false
marker.keys = Up, Down
marker.modifier = ShiftModifier
fit.key = F
fit.modifier = ControlModifier
pan.modifier = AltModifier
wheel.height = ShiftModifier
wheel.zoom = Any
wheel.scroll = ControlModifier
